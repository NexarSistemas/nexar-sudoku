<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>Página no encontrada | Nexar Sudoku</title>
  <link rel="canonical" href="https://sudoku.nexarsistemas.com.ar/404.html">
  <style>
    :root{--bg:#f7f4ed;--navy:#0b2239;--green:#16a36a;--green-dark:#0f7a50;--mint:#e8f7f0;--white:#fff;--muted:#607080}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Segoe UI,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--navy)}
    body{min-height:100vh;display:grid;place-items:center;padding:28px}.wrap{width:min(100%,980px);display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,.8fr);gap:clamp(36px,7vw,90px);align-items:center}
    .code{display:block;margin:0 0 12px;color:var(--green);font-size:clamp(5rem,16vw,10rem);font-weight:900;letter-spacing:-.08em;line-height:.82}h1{margin:0 0 18px;font-size:clamp(2.2rem,5vw,4rem);line-height:1.02}p{margin:0;max-width:560px;color:var(--muted);font-size:1.08rem;line-height:1.6}.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 18px;border:2px solid var(--navy);border-radius:10px;text-decoration:none;font-weight:800;color:var(--white);background:var(--navy)}.btn.alt{color:var(--navy);background:var(--white)}
    .visual{position:relative;min-height:330px;display:grid;place-items:center}.orbit{position:absolute;width:min(100%,330px);aspect-ratio:1;border:1px solid rgba(22,163,106,.28);border-radius:50%;transform:rotate(-18deg)}.orbit:after{content:"";position:absolute;top:12%;right:7%;width:13px;height:13px;border-radius:50%;background:var(--green);box-shadow:0 0 0 8px rgba(22,163,106,.12)}.robot{position:relative;z-index:1;width:178px;padding:30px 24px 24px;border:3px solid var(--navy);border-radius:34px 34px 42px 42px;background:var(--white);box-shadow:0 22px 0 rgba(11,34,57,.08);text-align:center}.robot:before{content:"";position:absolute;top:-27px;left:50%;width:20px;height:25px;border:3px solid var(--navy);border-bottom:0;border-radius:12px 12px 0 0;transform:translateX(-50%)}.robot:after{content:"";position:absolute;top:-38px;left:50%;width:10px;height:10px;border-radius:50%;background:var(--green);transform:translateX(-50%)}.face{display:flex;justify-content:center;gap:23px;padding:20px 0 22px;border-radius:20px;background:var(--mint)}.face i{width:14px;height:14px;border-radius:50%;background:var(--navy)}.mouth{width:38px;height:10px;margin:18px auto 0;border-bottom:3px solid var(--green-dark);border-radius:0 0 50% 50%}.brand{position:fixed;top:22px;left:24px;font-weight:900;letter-spacing:.02em}.brand span{color:var(--green)}
    @media(max-width:720px){.wrap{grid-template-columns:1fr;text-align:center}.copy p{margin-inline:auto}.actions{justify-content:center}.visual{min-height:270px}.orbit{width:260px}}
  </style>
</head>
<body>
  <div class="brand">NEXAR <span>SISTEMAS</span></div>
  <main class="wrap">
    <section class="copy" aria-labelledby="error-title">
      <span class="code" aria-hidden="true">404</span>
      <h1 id="error-title">Ups, esta página no existe.</h1>
      <p>El enlace puede haber cambiado o estar escrito de forma incorrecta. Podés volver a Nexar Sudoku y continuar desde ahí.</p>
      <div class="actions">
        <a class="btn" href="/">Volver a Sudoku</a>
        <a class="btn alt" href="https://nexarsistemas.com.ar/">Ir a Nexar Sistemas</a>
      </div>
    </section>
    <div class="visual" aria-label="Robot de Nexar buscando la página" role="img">
      <div class="orbit" aria-hidden="true"></div>
      <div class="robot" aria-hidden="true"><div class="face"><i></i><i></i></div><div class="mouth"></div></div>
    </div>
  </main>
</body>
</html>
